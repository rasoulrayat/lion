# Courier: downloads the files listed in jobs/*.json (from ElevenLabs / Higgsfield storage) into media/
# and commits them, so the Claude workspace (which can only reach GitHub) can pull them.
name: fetch-media
on:
  push:
    paths: ['jobs/**.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-media
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download listed files
        run: python3 .github/fetch.py
      - name: Commit results
        run: |
          git config user.name "media-courier"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media jobs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "courier: fetched media [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
